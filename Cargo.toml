[workspace]
resolver = "2"
members = [
    "contracts/beatsplit",
]

[workspace.dependencies]
soroban-sdk = { version = "28.0.0" }

[profile.release]
codegen-units = 1
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
